<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comparison Operators</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .result-text { font-weight: bold; color: #ffc107; background: #212529; padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">JS OPERATORS</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="operators.html">Home</a>
            <a class="nav-link" href="Arithmetic.html">Arithmetic</a>
            <a class="nav-link" href="Assignment.html">Assignment</a>
            <a class="nav-link active" href="Comparison.html">Comparison</a>
            <a class="nav-link" href="String.html">String</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 text-center">Comparison Operators</h2>
    <div class="input-section bg-white p-4 shadow-sm rounded mb-4 mx-auto" style="max-width: 600px;">
        <div class="row">
            <div class="col-6"><input type="number" id="v1" class="form-control" placeholder="Value 1"></div>
            <div class="col-6"><input type="number" id="v2" class="form-control" placeholder="Value 2"></div>
        </div>
    </div>

    <table class="table table-bordered text-center bg-white shadow-sm">
        <thead class="table-warning">
            <tr>
                <th>Operator</th>
                <th>Description</th>
                <th>Action</th>
                <th>Result (Boolean)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>==</td><td>Equal to</td><td><button onclick="isEqual()" class="btn btn-dark btn-sm">Check</button></td><td id="c1" class="result-text"></td></tr>
            <tr><td>!=</td><td>Not Equal</td><td><button onclick="notEqual()" class="btn btn-dark btn-sm">Check</button></td><td id="c2" class="result-text"></td></tr>
            <tr><td>></td><td>Greater Than</td><td><button onclick="isGreater()" class="btn btn-dark btn-sm">Check</button></td><td id="c3" class="result-text"></td></tr>
            <tr><td><</td><td>Less Than</td><td><button onclick="isLess()" class="btn btn-dark btn-sm">Check</button></td><td id="c4" class="result-text"></td></tr>
            <tr><td>>=</td><td>Greater than or equal to</td><td><button onclick="isLess()" class="btn btn-dark btn-sm">Check</button></td><td id="c5" class="result-text"></td></tr>
            <tr><td><=</td><td>Less than or equal to</td><td><button onclick="isLess()" class="btn btn-dark btn-sm">Check</button></td><td id="c6" class="result-text"></td></tr>

        </tbody>
    </table>
</div>

<script>
    function isEqual() {
        let a = Number(document.getElementById('v1').value);
        let b = Number(document.getElementById('v2').value);
        document.getElementById('c1').innerText = (a == b);
    }
    function notEqual() {
        let a = Number(document.getElementById('v1').value);
        let b = Number(document.getElementById('v2').value);
        document.getElementById('c2').innerText = (a != b);
    }
    function isGreater() {
        let a = Number(document.getElementById('v1').value);
        let b = Number(document.getElementById('v2').value);
        document.getElementById('c3').innerText = (a > b);
    }
    function isLess() {
        let a = Number(document.getElementById('v1').value);
        let b = Number(document.getElementById('v2').value);
        document.getElementById('c4').innerText = (a < b);
    }
    function isLess() {
        let a = Number(document.getElementById('v1').value);
        let b = Number(document.getElementById('v2').value);
        document.getElementById('c5').innerText = (a >= b);
    }
    function isLess() {
        let a = Number(document.getElementById('v1').value);
        let b = Number(document.getElementById('v2').value);
        document.getElementById('c6').innerText = (a <= b);
    }
</script>
</body>
</html>
