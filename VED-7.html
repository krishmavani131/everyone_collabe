<!DOCTYPE html>
<html>
<head>
<title>Gradient Example</title>
<style>

/* Linear Gradient */
.linear {
  width: 300px;
  height: 150px;
  background: linear-gradient(to right, red, yellow,black,blue,aqua,blue);
  margin-bottom: 20px;
}

/* Radial Gradient */
.radial {
  width: 300px;
  height: 150px;
  background: radial-gradient(circle, pink, purple,green,red,black
  );
  margin-bottom: 20px;
}

/* Conic Gradient */
.conic {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: conic-gradient(red, yellow, green,aqua, white, blue, red);
}

</style>
</head>
<body>

<p class="linear"></p>
<p class="radial"></p>
<p class="conic"></p>

</body>
</html>
