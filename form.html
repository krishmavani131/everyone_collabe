<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet"href="style.css">
</head>
<body>
    <form>
        <fieldset>
            <legend align="center">Registration Form</legend>
            <label>NAME:</label>
            <input type="text" readonly/>
            <br><br>
            <label>PASSWORD:</label>
            <input type="password" maxlength="8"/><br><br>
            <label>Email:</label>
            <input type="email"/><br><br>
            <label>D.O.B:</label>
            <input type="date"/><br><br>
            <label>GENDER:</label>
            <input type="radio"/>MALE
            <input type="radio"/>FEMALE <br><br>
            <label>HOBBIES:</label>
            <input type="checkbox"/>travel
            <input type="checkbox"/>singing
            <input type="checkbox"/>dancing
            <input type="checkbox"/>playing<BR><BR>
            <label>ADDRESS:</label>
            <textarea rows="5" cols="20"></textarea><br><br>
            <label>CITY</label>
            <select>
                <option selected disabled hidden>----select city----</option>
                <option>surat</option>
                <option>kim</option>
                <option>kosamba</option>
                <option>bharuch</option>
                <option>ankleshwar</option>
            </select><br><br>
            <label>file uploads</label>
            <input type="file"/><br><br>
            <label>RANGE</label>
            <input type="range"/><br><br>
            <label>SEARCH</label>
            <input type="search"/><br><br>
            <button>submit</button>
        </fieldset>
    </form>

</body>
</html>
