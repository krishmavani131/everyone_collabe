<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset style="width: 28%; border-width: 4px;">
            <legend>Signup</legend>
            <table>
                <tr>
                    <td><label for="username">User name</label></td>
                    <td><input type="text" placeholder="EnterName"></td>
                </tr>
                <tr>
                    <td><label for="password">Password</label></td>
                    <td><input type="text" placeholder="Enter Password"></td>
                </tr>
                <tr>
                    <td><label for="gender">Gender</label></td>

                    <td><input type="radio" checked name="gender">Male
        
                    <input type="radio" name="gender">Female
        
                    <input type="radio" name="gender">Other</td>
                </tr>
                <tr>
                    <td><label for="date">Birth Date</label></td>
                    <td><input type="date" name="date"></td>
                </tr>
                <tr>
                    <td><label for="email">Email ID</label></td>
                    <td><input type="email" name="email"></td>
                </tr>
                <tr>
                    <td><label for="Area Of Intrest">Area Of Intrest</label></td>
                    <td>
                        <input type="checkbox" checked name="sub">DS
        
                        <input type="checkbox" name="sub">DBMS

                        <input type="checkbox" name="sub">Full Stack
                    </td>
                </tr>
                <tr>
                    <td><label for="Department" >Department</label></td>
                    <td><select><option selected disabled hidden >--select Branch--</option></select></td>
                </tr>
                <tr>
                    <td><label for="number">No.of Book Issued</label></td>
                    <td><input type="number" name="number" style="width: 50px;"></td>
                </tr>
                <tr>
                    <td><label for="address" >Address</label></td>
                    <td><textarea name="address" rows="8" cols="22"></textarea></td>
                </tr>
                <tr>
                    <td><label for="file">Upload CV</label></td>
                    <td><input type="file" name="file"></td>
                </tr>
                <tr>
                    <td><label for="search">Search Here</label></td>
                    <td><input type="search" name="search"></td>
                </tr>
                <tr>
                    <td><label for="range">Rate this form(0 to 50)</label></td>
                    <td><input type="range" name="range"></td>
                </tr>
                <tr>
                    <td><input type="submit" value="Click me">
                    <input type="reset" name="reset"></td>
                </tr>
            </table>
        </fieldset>
    </form>
    <br><br>
    <table border="1" align="center">
        <form>
            <tr>
                <td colspan="2" align="center">Pizza shop 2.0</td>
            </tr>

            <tr>
                <td><label for="Name">Name</label></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><label for="topping">Pizza topping</label></td>

                <td><input type="radio" name="topping">Supreme
                <br>
                <input type="radio" name="topping">Veletarian
                <br>
                <input type="radio" name="topping">Hawaiian</td>
            </tr>

            <tr>
                <td><label for="Pizza_Sauce" >Pizza Sauce</label></td>
                <td><select><option selected disabled hidden >Tomato</option></select></td>
            </tr>

            <tr>
                <td><label for="Optional_extra">Optional Extra</label></td>
                <td>
                    <input type="checkbox" name="extra">Extra Cheese
        
                    <input type="checkbox" name="extra">Glten Free Base
                </td>
            </tr>

            <tr>
                <td colspan="2"><label>Delivery Instruction</label><br>
                <textarea name="address" rows="5" cols="50"></textarea></td>
            </tr>

            <tr>
                <td colspan="2"><input type="submit" value="Send my order">
            </tr>
        </form>
    </table>
</body>
</html>
